<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062968"><title>RMC Gestión · Mi cuenta</title><style>:root{--navy:#062968;--orange:#ff5108;--bg:#f3f6fa;--muted:#6d778a}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#182234}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:24px;width:min(460px,100%);box-shadow:0 3px 16px rgba(0,0,0,.06)}.bar{height:8px;background:linear-gradient(90deg,var(--navy) 0 75%,var(--orange) 75%);border-radius:8px;margin-bottom:20px}h1{color:var(--navy);font-size:24px;margin:0 0 6px}p{color:var(--muted);font-size:13px;line-height:1.45}label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:bold;display:block;margin:14px 0 5px}input{width:100%;border:1px solid #ccd5e2;border-radius:9px;padding:11px;font-size:14px}button,a.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;font-weight:bold;cursor:pointer;text-decoration:none;margin-top:12px}.primary{background:var(--navy);color:#fff}.ghost{background:#e9eef6;color:var(--navy)}.status{font-size:12px;color:var(--muted);margin-top:12px}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap"><div class="card"><div class="bar"></div><h1>RMC Gestión</h1><p>Recuperación y cambio de contraseña</p><section id="recover"><label>Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="Tu correo de RMC Gestión"><div class="actions"><button class="primary" onclick="sendReset()">Enviar enlace de recuperación</button><a class="btn ghost" href="./">Volver</a></div><div id="recoverStatus" class="status">Te enviaremos un enlace seguro para crear una contraseña nueva.</div></section><section id="change" class="hidden"><label>Nueva contraseña</label><input id="p1" type="password" autocomplete="new-password"><label>Repetir nueva contraseña</label><input id="p2" type="password" autocomplete="new-password"><div class="actions"><button class="primary" onclick="changePassword()">Guardar nueva contraseña</button><a class="btn ghost" href="./">Volver a RMC Gestión</a></div><div id="changeStatus" class="status">Utiliza al menos 8 caracteres.</div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://gbcrptmxxoztuqlslyhl.supabase.co','sb_publishable_Y2Ep_DgA9Nw43ZMAuIW9fw_3Gw4QIXj');const $=id=>document.getElementById(id);async function sendReset(){const email=$('email').value.trim();if(!email){$('recoverStatus').textContent='Escribe tu correo electrónico.';return}$('recoverStatus').textContent='Enviando…';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$('recoverStatus').textContent=error?'No se pudo enviar: '+error.message:'Enlace enviado. Revisa tu correo y abre el mensaje de recuperación.'}async function changePassword(){const a=$('p1').value,b=$('p2').value;if(a.length<8){$('changeStatus').textContent='La contraseña debe tener al menos 8 caracteres.';return}if(a!==b){$('changeStatus').textContent='Las dos contraseñas no coinciden.';return}$('changeStatus').textContent='Guardando…';const {error}=await sb.auth.updateUser({password:a});$('changeStatus').textContent=error?'No se pudo cambiar: '+error.message:'Contraseña cambiada correctamente. Ya puedes usarla en todos tus dispositivos.'}function showChange(){ $('recover').classList.add('hidden');$('change').classList.remove('hidden')}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)showChange()});(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)showChange()})();</script></body></html>
